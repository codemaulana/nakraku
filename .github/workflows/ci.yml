name: CI Quality Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  quality-and-guardrails:
    name: Lint & Guardrails
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run check

      - name: Run anti-slop guardrail scanner
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/guardrails.ps1

  test-frontend:
    name: Frontend Test Suite & Coverage
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build

      - name: Run Vitest with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  test-rust:
    name: Native Rust Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-check:
    name: Production Build Verification
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build

      - name: Build Browser Extension
        run: npm run build:extension

  perf-regression:
    name: Performance Regression Gate
    runs-on: windows-latest
    needs: [build-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Bundle
        run: npm run build

      - name: Run Performance Regression Gate
        run: node scripts/perf-regression-gate.mjs
