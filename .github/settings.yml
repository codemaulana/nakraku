# GitHub Repository Settings Specification (Probot Settings / Repository Automation)

repository:
  name: stash
  description: "Ultra-compact, high-density desktop workspace & window stashing engine for Windows 10/11. Built with Tauri v2, Rust, and React 19."
  homepage: https://nakraku.app
  topics:
    - windows
    - tauri
    - rust
    - react
    - typescript
    - workspace-manager
    - window-manager
    - desktop-app
    - productivity
    - sqlite
    - open-source

  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  has_discussions: true

  default_branch: master
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

branches:
  - name: master
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - "quality-and-guardrails"
          - "test-frontend"
          - "test-rust"
          - "build-check"
          - "perf-regression"
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
