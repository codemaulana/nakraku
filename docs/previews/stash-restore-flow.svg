<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulseRing {
        0%, 100% { opacity: 0.2; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes cycleSteps {
        0%, 30% { opacity: 1; }
        33%, 97% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes cycleStep2 {
        0%, 31% { opacity: 0; }
        35%, 65% { opacity: 1; }
        68%, 100% { opacity: 0; }
      }
      @keyframes cycleStep3 {
        0%, 66% { opacity: 0; }
        70%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }
      .font-mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .font-ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="0" y="0" width="880" height="440" rx="10" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Frameless Custom Titlebar (38px) -->
  <rect x="0" y="0" width="880" height="38" rx="10" fill="#0C0F17" />
  <rect x="0" y="30" width="880" height="8" fill="#0C0F17" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#1F2937" stroke-width="1" />

  <!-- Titlebar App Icon & Brand -->
  <rect x="16" y="11" width="16" height="16" rx="3" fill="#10B981" />
  <text x="21" y="23" font-family="monospace" font-weight="bold" font-size="11" fill="#080A0E">N</text>
  <text x="40" y="23" class="font-mono" font-size="12" font-weight="600" fill="#E5E7EB">NAKRAKU STASH</text>
  <text x="148" y="23" class="font-mono" font-size="11" fill="#6B7280">v0.1.0-release</text>

  <!-- Titlebar Controls -->
  <circle cx="818" cy="19" r="5" fill="#374151" />
  <circle cx="838" cy="19" r="5" fill="#374151" />
  <circle cx="858" cy="19" r="5" fill="#EF4444" opacity="0.8" />

  <!-- Navigation Bar (32px) -->
  <rect x="16" y="50" width="848" height="34" rx="4" fill="#141820" stroke="#1F2937" stroke-width="1" />
  <rect x="22" y="54" width="94" height="26" rx="3" fill="#1F2937" />
  <text x="36" y="71" class="font-mono" font-size="11" font-weight="bold" fill="#10B981">DASHBOARD</text>
  <text x="134" y="71" class="font-mono" font-size="11" fill="#9CA3AF">WORKSPACES</text>
  <text x="238" y="71" class="font-mono" font-size="11" fill="#9CA3AF">SETTINGS</text>

  <!-- Live Telemetry Pill -->
  <rect x="660" y="55" width="196" height="24" rx="3" fill="#0B0F17" stroke="#10B981" stroke-width="0.8" />
  <circle cx="672" cy="67" r="3.5" fill="#10B981" />
  <text x="682" y="71" class="font-mono" font-size="10.5" fill="#D1D5DB">WS: CONNECTED :48123</text>

  <!-- STEP 1: ACTIVE CLUTTERED SESSION (0s - 3s) -->
  <g style="animation: cycleSteps 9s infinite;">
    <rect x="16" y="96" width="848" height="260" rx="4" fill="#0C1017" stroke="#1F2937" stroke-width="1" />
    <text x="32" y="122" class="font-mono" font-size="12" font-weight="bold" fill="#F3F4F6">ACTIVE WORKSPACE: &quot;Full-Stack Dev&quot;</text>
    <text x="640" y="122" class="font-mono" font-size="11" fill="#F59E0B">RAM: 14.8 / 32.0 GB (46%)</text>
    <line x1="16" y1="134" x2="864" y2="134" stroke="#1F2937" stroke-width="1" />

    <!-- Table Rows (32px each) -->
    <g transform="translate(32, 142)">
      <rect x="0" y="0" width="816" height="30" rx="3" fill="#141923" />
      <text x="12" y="19" class="font-mono" font-size="11" fill="#10B981">[x]</text>
      <text x="36" y="19" class="font-mono" font-size="11" font-weight="bold" fill="#E5E7EB">Visual Studio Code (src-tauri)</text>
      <text x="360" y="19" class="font-mono" font-size="11" fill="#9CA3AF">Code.exe (PID 18420)</text>
      <text x="580" y="19" class="font-mono" font-size="11" fill="#10B981">1,248 MB</text>
      <text x="710" y="19" class="font-mono" font-size="10" fill="#6B7280">Display 1 (Primary)</text>

      <rect x="0" y="34" width="816" height="30" rx="3" fill="#111620" />
      <text x="12" y="53" class="font-mono" font-size="11" fill="#10B981">[x]</text>
      <text x="36" y="53" class="font-mono" font-size="11" font-weight="bold" fill="#E5E7EB">Google Chrome (12 tabs active)</text>
      <text x="360" y="53" class="font-mono" font-size="11" fill="#9CA3AF">chrome.exe (PID 14210)</text>
      <text x="580" y="53" class="font-mono" font-size="11" fill="#10B981">2,410 MB</text>
      <text x="710" y="53" class="font-mono" font-size="10" fill="#6B7280">Display 1 (Primary)</text>

      <rect x="0" y="68" width="816" height="30" rx="3" fill="#141923" />
      <text x="12" y="87" class="font-mono" font-size="11" fill="#10B981">[x]</text>
      <text x="36" y="87" class="font-mono" font-size="11" font-weight="bold" fill="#E5E7EB">Windows Terminal (pwsh)</text>
      <text x="360" y="87" class="font-mono" font-size="11" fill="#9CA3AF">WindowsTerminal.exe (PID 9104)</text>
      <text x="580" y="87" class="font-mono" font-size="11" fill="#10B981">184 MB</text>
      <text x="710" y="87" class="font-mono" font-size="10" fill="#6B7280">Display 2 (Left)</text>

      <rect x="0" y="102" width="816" height="30" rx="3" fill="#111620" />
      <text x="12" y="121" class="font-mono" font-size="11" fill="#10B981">[x]</text>
      <text x="36" y="121" class="font-mono" font-size="11" font-weight="bold" fill="#E5E7EB">Figma Desktop App</text>
      <text x="360" y="121" class="font-mono" font-size="11" fill="#9CA3AF">Figma.exe (PID 22894)</text>
      <text x="580" y="121" class="font-mono" font-size="11" fill="#10B981">942 MB</text>
      <text x="710" y="121" class="font-mono" font-size="10" fill="#6B7280">Display 1 (Primary)</text>
    </g>

    <!-- Stash CTA Button (36px) -->
    <rect x="16" y="364" width="280" height="36" rx="4" fill="url(#emeraldGrad)" />
    <text x="32" y="386" class="font-mono" font-size="12" font-weight="bold" fill="#080A0E">⚡ STASH NOW (Ctrl+Shift+N)</text>
    <text x="312" y="386" class="font-mono" font-size="11" fill="#9CA3AF">Target: 4 processes, 12 tabs, ~4.78 GB to freeze</text>
  </g>

  <!-- STEP 2: STASHING EXECUTED (3s - 6s) -->
  <g style="animation: cycleStep2 9s infinite;">
    <rect x="16" y="96" width="848" height="260" rx="4" fill="#0C1017" stroke="#10B981" stroke-width="1.2" />
    <text x="32" y="122" class="font-mono" font-size="12" font-weight="bold" fill="#10B981">✓ WORKSPACE STASHED SUCCESSFULLY</text>
    <text x="640" y="122" class="font-mono" font-size="11" fill="#10B981">RAM: 4.9 / 32.0 GB (RECLAIMED 9.9 GB)</text>
    <line x1="16" y1="134" x2="864" y2="134" stroke="#1F2937" stroke-width="1" />

    <g transform="translate(32, 160)">
      <rect x="0" y="0" width="816" height="120" rx="4" fill="#0F141D" stroke="#1F2937" stroke-width="1" />
      <text x="24" y="32" class="font-mono" font-size="13" font-weight="bold" fill="#E5E7EB">Snapshot Summary: &quot;Full-Stack Dev&quot;</text>
      <text x="24" y="60" class="font-mono" font-size="11.5" fill="#9CA3AF">• EnumWindows Snapshot Latency:   <tspan fill="#10B981" font-weight="bold">3.2 ms</tspan></text>
      <text x="24" y="80" class="font-mono" font-size="11.5" fill="#9CA3AF">• SQLite Session &amp; Tab Insert:     <tspan fill="#10B981" font-weight="bold">8.4 ms</tspan></text>
      <text x="24" y="100" class="font-mono" font-size="11.5" fill="#9CA3AF">• Win32 ShowWindow Minimize Batch:  <tspan fill="#10B981" font-weight="bold">133.5 ms</tspan></text>
      <text x="500" y="60" class="font-mono" font-size="11.5" fill="#9CA3AF">• Total Windows Stashed: <tspan fill="#10B981" font-weight="bold">4 windows</tspan></text>
      <text x="500" y="80" class="font-mono" font-size="11.5" fill="#9CA3AF">• Browser Tabs Closed:   <tspan fill="#10B981" font-weight="bold">12 tabs</tspan></text>
      <text x="500" y="100" class="font-mono" font-size="11.5" fill="#9CA3AF">• Overall Operation Time: <tspan fill="#10B981" font-weight="bold">145.1 ms</tspan></text>
    </g>

    <!-- Restore CTA Button (36px) -->
    <rect x="16" y="364" width="280" height="36" rx="4" fill="#1F2937" stroke="#10B981" stroke-width="1" />
    <text x="32" y="386" class="font-mono" font-size="12" font-weight="bold" fill="#10B981">↺ RESTORE WORKSPACE (Ctrl+Shift+R)</text>
    <text x="312" y="386" class="font-mono" font-size="11" fill="#9CA3AF">All windows minimized | Desktop uncluttered | Ready</text>
  </g>

  <!-- STEP 3: RESTORE COMPLETE (6s - 9s) -->
  <g style="animation: cycleStep3 9s infinite;">
    <rect x="16" y="96" width="848" height="260" rx="4" fill="#0C1017" stroke="#3B82F6" stroke-width="1.2" />
    <text x="32" y="122" class="font-mono" font-size="12" font-weight="bold" fill="#60A5FA">↺ SESSION RESTORED TO MULTI-MONITOR COORDINATES</text>
    <text x="640" y="122" class="font-mono" font-size="11" fill="#60A5FA">RESTORE TIME: 418.5 ms</text>
    <line x1="16" y1="134" x2="864" y2="134" stroke="#1F2937" stroke-width="1" />

    <g transform="translate(32, 160)">
      <rect x="0" y="0" width="816" height="120" rx="4" fill="#0F141D" stroke="#1F2937" stroke-width="1" />
      <text x="24" y="32" class="font-mono" font-size="13" font-weight="bold" fill="#E5E7EB">Restoration Verification:</text>
      <text x="24" y="60" class="font-mono" font-size="11.5" fill="#9CA3AF">• Display 1 (1920x1080):  <tspan fill="#60A5FA">Code.exe (0,0,1280,1040), Figma.exe (640,0,1280,1040)</tspan></text>
      <text x="24" y="80" class="font-mono" font-size="11.5" fill="#9CA3AF">• Display 2 (-1920,0):     <tspan fill="#60A5FA">WindowsTerminal.exe (-1920,0,1920,1080)</tspan></text>
      <text x="24" y="100" class="font-mono" font-size="11.5" fill="#9CA3AF">• Companion Extension:    <tspan fill="#60A5FA">12 Chrome tabs reopened across target windows</tspan></text>
      <text x="560" y="75" class="font-mono" font-size="12" font-weight="bold" fill="#10B981">PIXEL-PERFECT MATCH ✓</text>
    </g>

    <rect x="16" y="364" width="280" height="36" rx="4" fill="#141820" stroke="#374151" stroke-width="1" />
    <text x="32" y="386" class="font-mono" font-size="12" font-weight="bold" fill="#9CA3AF">STATUS: RUNNING ACTIVE</text>
    <text x="312" y="386" class="font-mono" font-size="11" fill="#9CA3AF">Cycle complete. Press Ctrl+Shift+N to stash again.</text>
  </g>

  <!-- Bottom Utility Bar (26px) -->
  <line x1="0" y1="414" x2="880" y2="414" stroke="#1F2937" stroke-width="1" />
  <text x="16" y="429" class="font-mono" font-size="10.5" fill="#6B7280">SQLite WAL Active | Non-Admin Mode | Zero Cloud Telemetry | Offline Ed25519</text>
  <text x="750" y="429" class="font-mono" font-size="10.5" fill="#10B981">60 FPS Virtualized</text>
</svg>
