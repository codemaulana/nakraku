pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx oxlint
    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    cargo-check:
      glob: "*.rs"
      run: cargo check --manifest-path src-tauri/Cargo.toml
    guardrails:
      run: powershell -ExecutionPolicy Bypass -File scripts/guardrails.ps1
    test:
      run: npm test
